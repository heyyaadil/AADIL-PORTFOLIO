<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AADIL — Developer Portfolio</title>
<meta name="description" content="AADIL, first-year Computer Science student, developer and tech enthusiast.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,700;12..96,800&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
@property --ang{syntax:'<angle>';initial-value:0deg;inherits:false}
:root{
  --bg:#0b0c10; --bg2:#14161b; --line:rgba(255,255,255,.09); --text:#ecedf0; --mute:#9a9ea8;
  --a:#6f8fff; --b:#ffa66b; --c:#ff5fc4; --d:#37e3d0; --v:#8b5cf6; --card:rgba(255,255,255,.035);
  --display:"Bricolage Grotesque","Helvetica Neue",Arial,sans-serif;
  --body:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --ease:cubic-bezier(.16,1,.3,1);
  color-scheme:dark; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b0c10;--text:#ecedf0}}
:root[data-theme="dark"]{--bg:#0b0c10;--text:#ecedf0}
*,*::before,*::after{box-sizing:inherit}
html{scroll-behavior:smooth;scroll-padding-top:calc(76px + env(safe-area-inset-top,0px))}
html.lenis,html.lenis body{height:auto}.lenis.lenis-smooth{scroll-behavior:auto !important}
body{margin:0;background:var(--bg);color:var(--text);font:400 1.0625rem/1.65 var(--body);overflow-x:hidden;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:60}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--a);outline-offset:3px;border-radius:6px}
.wrap{width:min(1180px,100% - 2.5rem);margin-inline:auto}
section{padding:clamp(4.5rem,10vw,8rem) 0}

/* background */
.aurora{position:fixed;inset:0;z-index:-3;overflow:hidden;pointer-events:none}
.aurora i{position:absolute;width:62vmax;height:62vmax;border-radius:50%;mix-blend-mode:screen;will-change:transform;animation:aur 28s ease-in-out infinite alternate}
.aurora i:nth-child(1){left:-22vmax;top:-28vmax;background:radial-gradient(circle,rgba(79,110,255,.34),transparent 65%)}
.aurora i:nth-child(2){right:-26vmax;top:2vh;background:radial-gradient(circle,rgba(139,92,246,.3),transparent 65%);animation-duration:34s;animation-direction:alternate-reverse}
.aurora i:nth-child(3){left:18vw;bottom:-38vmax;background:radial-gradient(circle,rgba(255,95,196,.22),transparent 65%);animation-duration:40s}
.aurora i:nth-child(4){right:8vw;bottom:-32vmax;width:50vmax;height:50vmax;background:radial-gradient(circle,rgba(55,227,208,.2),transparent 65%);animation-duration:31s;animation-direction:alternate-reverse}
.aurora i:nth-child(5){left:52vw;top:42vh;width:28vmax;height:28vmax;background:radial-gradient(circle,rgba(255,166,107,.12),transparent 65%);animation-duration:37s}
.aurora::after{content:"";position:absolute;top:-20%;bottom:-20%;left:0;width:60%;background:linear-gradient(105deg,transparent 35%,rgba(255,255,255,.035) 50%,transparent 65%);transform:translateX(-100%);animation:sheen 18s ease-in-out infinite}
@keyframes aur{to{transform:translate(7vmax,5vmax) scale(1.12)}}
@keyframes sheen{60%,100%{transform:translateX(260%)}}
.dust{position:fixed;inset:0;width:100%;height:100%;z-index:-2;pointer-events:none;opacity:.6}

/* nav */
header{position:fixed;top:env(safe-area-inset-top,0px);left:0;right:0;z-index:50;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);background:rgba(11,12,16,.55);border-bottom:1px solid var(--line)}
.nav{display:flex;align-items:center;justify-content:space-between;height:64px}
.logo{font:800 1.35rem var(--display);letter-spacing:-.02em;display:inline-block}
.links{display:flex;gap:.25rem}
.links a{position:relative;padding:.5rem .9rem;color:var(--mute);font-size:.95rem;transition:color .3s}
.links a:hover,.links a.on{color:var(--text)}
.links a::after{content:"";position:absolute;left:.9rem;right:.9rem;bottom:.2rem;height:2px;border-radius:2px;background:linear-gradient(90deg,var(--a),var(--c),var(--b));transform:scaleX(0);transform-origin:right;transition:transform .5s var(--ease)}
.links a:hover::after,.links a.on::after{transform:scaleX(1);transform-origin:left}
.burger{display:none;background:none;border:1px solid var(--line);color:var(--text);border-radius:10px;padding:.45rem .8rem;font:inherit;cursor:pointer}
@media(max-width:780px){
  .burger{display:block}
  .links{position:absolute;top:64px;left:0;right:0;flex-direction:column;background:var(--bg2);padding:.75rem 1.25rem 1.25rem;border-bottom:1px solid var(--line);display:none}
  .links.open{display:flex}.links a{padding:.8rem .5rem;font-size:1.05rem}.links a::after{left:.5rem;right:auto;width:3rem}
}

/* hero */
.hero{min-height:100svh;display:flex;align-items:flex-end;padding:7rem 0 3.5rem;position:relative;overflow:hidden;isolation:isolate}
.core{position:absolute;inset:0;width:100%;height:100%;z-index:-1;pointer-events:none}
.name{font:800 clamp(5.2rem,27vw,23rem)/.82 var(--display);letter-spacing:-.055em;margin:0 0 .12em -.04em;display:flex;user-select:none;overflow:hidden;padding:.04em .04em .08em 0}
.name span{display:inline-block;background:linear-gradient(180deg,hsl(calc(var(--i)*48 + 205) 100% 82%),hsl(calc(var(--i)*48 + 255) 95% 63%));-webkit-background-clip:text;background-clip:text;color:transparent;animation:rise 1.5s var(--ease) both;animation-delay:calc(var(--i)*100ms + 250ms);transition:transform .5s var(--ease)}
.name span:hover{transform:translateY(-3%)}
@keyframes rise{from{transform:translateY(105%) rotate(5deg);opacity:0;filter:blur(14px)}60%{filter:blur(0)}to{transform:none;opacity:1;filter:blur(0)}}
@keyframes up{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
.hero-row{display:flex;justify-content:space-between;align-items:flex-end;gap:2rem;flex-wrap:wrap}
.role,.lead,.btns{animation:up 1.1s var(--ease) both}
.role{font:700 clamp(1.15rem,2.2vw,1.6rem)/1.3 var(--display);letter-spacing:-.01em;margin:.4rem 0 .6rem;animation-delay:1.0s}
.lead{color:var(--mute);max-width:46ch;margin:0 0 1.75rem;animation-delay:1.15s}
.btns{display:flex;gap:.75rem;flex-wrap:wrap;animation-delay:1.3s}
.btn{position:relative;overflow:hidden;isolation:isolate;display:inline-flex;align-items:center;padding:.85rem 1.45rem;border-radius:99px;font-weight:600;font-size:1rem;border:1px solid var(--line);color:var(--text);background:transparent;font-family:inherit;cursor:pointer;transition:color .35s,border-color .35s}
.btn::before{content:"";position:absolute;inset:0;z-index:-1;border-radius:inherit;background:linear-gradient(120deg,var(--a),var(--v),var(--c));transform:translateY(101%);transition:transform .55s var(--ease)}
.btn:hover::before{transform:none}.btn:hover{color:#0b0c10;border-color:transparent}
.btn.p{background:linear-gradient(120deg,var(--a),var(--v) 50%,var(--c));color:#0b0c10;border-color:transparent}
.btn.p::before{background:linear-gradient(120deg,var(--b),var(--c));}
.scroll{color:var(--mute);font-size:.9rem;writing-mode:vertical-rl;animation:up 1s 1.5s both}
@media(max-width:640px){.scroll{display:none}}

/* shared */
h2{font:800 clamp(2.2rem,5.5vw,4rem)/1.04 var(--display);letter-spacing:-.035em;margin:0 0 1rem;max-width:16ch;background:linear-gradient(100deg,#fff 30%,var(--a) 65%,var(--c));-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{color:var(--mute);max-width:52ch;margin:0 0 3rem}

/* about */
.about{display:grid;grid-template-columns:1.25fr 1fr;gap:clamp(2rem,6vw,5rem);align-items:start}
.about p{margin:0 0 1.1rem;color:#c7cad1}
.facts{border-left:1px solid var(--line);padding-left:clamp(1.25rem,3vw,2.5rem);display:grid;gap:1.5rem}
.facts b{display:block;font:700 1.15rem var(--display)}.facts span{color:var(--mute);font-size:.95rem}
.ph{color:var(--b)}
@media(max-width:820px){.about{grid-template-columns:1fr}.facts{border-left:0;border-top:1px solid var(--line);padding:1.5rem 0 0}}

/* skills */
.bento{display:grid;grid-template-columns:repeat(4,1fr);gap:1rem;grid-auto-rows:1fr}
.bw.w2{grid-column:span 2}
.sk{position:relative;height:100%;min-height:170px;padding:1.5rem;border-radius:22px;overflow:hidden;display:flex;flex-direction:column;justify-content:space-between;background:linear-gradient(160deg,color-mix(in srgb,var(--tint) 22%,transparent),var(--card) 70%);border:1px solid color-mix(in srgb,var(--tint) 30%,transparent);transition:transform .6s var(--ease),border-color .4s,box-shadow .6s var(--ease)}
.sk:hover{transform:translateY(-5px);border-color:var(--tint);box-shadow:0 20px 50px -24px var(--tint)}
.sk .g{font:800 2.4rem/1 var(--display);letter-spacing:-.04em;color:var(--tint)}
.sk h3{margin:1.5rem 0 .15rem;font:700 1.15rem var(--display)}
.sk p{margin:0;color:var(--mute);font-size:.9rem;line-height:1.45}
@media(max-width:960px){.bento{grid-template-columns:repeat(2,1fr)}}
@media(max-width:480px){.bento{grid-template-columns:1fr}.bw.w2{grid-column:auto}}

/* projects */
.projects{display:grid;gap:clamp(2.5rem,6vw,4.5rem)}
.pj{display:grid;grid-template-columns:1.3fr 1fr;gap:clamp(1.25rem,4vw,3rem);align-items:center}
.pj:nth-child(even){grid-template-columns:1fr 1.3fr}.pj:nth-child(even) .shot{order:2}
.shot{display:block;aspect-ratio:16/10;border-radius:24px;position:relative;overflow:hidden;background:var(--bg2);border:1px solid var(--line);will-change:transform;transition:box-shadow .6s var(--ease)}
.shot:hover{box-shadow:0 40px 90px -35px var(--tint)}
.shot::before{content:"";position:absolute;inset:0;z-index:4;border-radius:inherit;padding:1.5px;pointer-events:none;background:conic-gradient(from var(--ang),#6f8fff,#8b5cf6,#ff5fc4,#37e3d0,#ffa66b,#6f8fff);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0);opacity:0;transition:opacity .5s;animation:spin 5s linear infinite}
.shot:hover::before{opacity:1}
@keyframes spin{to{--ang:360deg}}
.shot i,.shot img{position:absolute;inset:0;background:var(--art);transition:transform 1.1s var(--ease)}
.shot img{width:100%;height:100%;object-fit:cover}
.shot .win{position:absolute;left:8%;right:8%;top:14%;bottom:-8%;border-radius:14px 14px 0 0;background:rgba(11,12,16,.8);border:1px solid var(--line);backdrop-filter:blur(8px);padding:1rem;transition:transform 1.1s var(--ease)}
.shot:hover i,.shot:hover img{transform:scale(1.08)}.shot:hover .win{transform:translateY(-4%) scale(1.03)}
.win u{display:block;height:8px;border-radius:4px;background:rgba(255,255,255,.12);margin-bottom:.6rem;text-decoration:none}
.win u:nth-child(1){width:38%;background:var(--tint)}.win u:nth-child(2){width:80%}.win u:nth-child(3){width:64%}.win u:nth-child(4){width:72%}
.reveal{position:absolute;left:0;right:0;bottom:0;z-index:3;display:flex;justify-content:space-between;align-items:center;gap:.75rem;flex-wrap:wrap;padding:2.5rem 1.1rem 1rem;background:linear-gradient(0deg,rgba(11,12,16,.92),transparent);transform:translateY(100%);opacity:0;transition:transform .7s var(--ease),opacity .5s}
.shot:hover .reveal{transform:none;opacity:1}
.reveal em{font-style:normal;font-size:.82rem;color:var(--text);display:flex;gap:.35rem;flex-wrap:wrap}
.reveal em span{padding:.2rem .6rem;border-radius:99px;border:1px solid rgba(255,255,255,.22);background:rgba(255,255,255,.06)}
.reveal b{font-size:.9rem;font-weight:600}
@media(hover:none){.reveal{display:none}}
.pj h3{font:800 clamp(1.6rem,3vw,2.2rem)/1.1 var(--display);letter-spacing:-.03em;margin:0 0 .75rem}
.pj p{color:var(--mute);margin:0 0 1.1rem}
.tags{display:flex;flex-wrap:wrap;gap:.4rem;margin-bottom:1.25rem}
.tags span{font-size:.82rem;padding:.25rem .7rem;border-radius:99px;border:1px solid color-mix(in srgb,var(--tint) 45%,transparent);background:color-mix(in srgb,var(--tint) 14%,transparent)}
.gh{display:inline-flex;font-weight:600;border-bottom:1px solid var(--mute);padding-bottom:2px;transition:color .3s,border-color .3s}
.gh:hover{color:var(--d);border-color:var(--d)}
@media(max-width:820px){.pj,.pj:nth-child(even){grid-template-columns:1fr}.pj:nth-child(even) .shot{order:0}}

/* achievements */
.ach{display:grid;grid-template-columns:minmax(220px,300px) 1fr;gap:clamp(1.5rem,5vw,4rem)}
.tabs{display:flex;flex-direction:column;gap:.25rem}
.tab{text-align:left;background:none;border:0;color:var(--mute);font:600 1.15rem var(--display);padding:.7rem 1rem;border-radius:14px;cursor:pointer;transition:background .3s,color .3s}
.tab:hover{color:var(--text)}
.tab[aria-selected=true]{background:linear-gradient(120deg,rgba(111,143,255,.28),rgba(255,95,196,.22));color:var(--text)}
.panel{border:1px solid var(--line);border-radius:24px;padding:clamp(1.25rem,3vw,2.25rem);background:var(--card);min-height:260px;animation:fade .6s var(--ease)}
@keyframes fade{from{opacity:0;transform:translateY(10px)}}
.panel h3{font:800 1.7rem var(--display);letter-spacing:-.03em;margin:0 0 .4rem}
.panel>p{color:var(--mute);margin:0 0 1.5rem}
.item{padding:1rem 0;border-top:1px dashed var(--line);display:flex;justify-content:space-between;gap:1rem;flex-wrap:wrap}
.item b{font-weight:600}.item span{color:var(--mute);font-size:.92rem}
@media(max-width:820px){.ach{grid-template-columns:1fr}.tabs{flex-direction:row;overflow-x:auto;padding-bottom:.4rem}.tab{white-space:nowrap;font-size:1rem}}

/* contact */
.contact h2{max-width:none;font-size:clamp(2.6rem,9vw,7rem);line-height:.95}
.clist{margin-top:3rem;border-top:1px solid var(--line)}
.crow{display:flex;justify-content:space-between;align-items:center;gap:1rem;padding:1.35rem .25rem;border-bottom:1px solid var(--line);transition:padding .5s var(--ease),background .5s}
.crow:hover{padding-inline:1.25rem;background:linear-gradient(100deg,rgba(111,143,255,.14),rgba(255,95,196,.1),rgba(255,166,107,.1))}
.crow b{font:700 clamp(1.2rem,2.6vw,1.8rem) var(--display);letter-spacing:-.02em;transition:transform .5s var(--ease)}
.crow:hover b{transform:translateX(8px)}
.crow span{color:var(--mute);font-size:.95rem;overflow-wrap:anywhere;text-align:right}
footer{border-top:1px solid var(--line);padding:2rem 0;color:var(--mute);font-size:.9rem}
footer .wrap{display:flex;justify-content:space-between;gap:1rem;flex-wrap:wrap}

/* refinements */
.hero .wrap{position:relative}
.hero .wrap::before{content:"";position:absolute;left:-6%;top:-14%;width:78%;height:82%;z-index:-2;pointer-events:none;background:radial-gradient(ellipse at 30% 50%,rgba(111,143,255,.34),rgba(139,92,246,.22) 40%,rgba(255,95,196,.14) 62%,transparent 76%);filter:blur(44px);opacity:0;animation:hglow 16s ease-in-out infinite alternate,hin 2.2s .3s var(--ease) forwards}
@keyframes hglow{to{transform:translate3d(6%,4%,0) scale(1.14)}}
@keyframes hin{to{opacity:1}}
.name{animation:track 2.4s var(--ease) .2s both}
@keyframes track{from{letter-spacing:-.005em}to{letter-spacing:-.055em}}
.aurora::before{content:"";position:absolute;inset:0;z-index:1;background:radial-gradient(ellipse at 50% 35%,transparent 35%,rgba(5,6,9,.5))}
.aurora i{translate:0 calc(var(--py,0px)*var(--k,1))}
.aurora i:nth-child(2){--k:.6}.aurora i:nth-child(3){--k:1.4}.aurora i:nth-child(4){--k:.9}.aurora i:nth-child(5){--k:1.8}
section{position:relative}
section:not(.hero)::before{content:"";position:absolute;top:0;left:50%;width:min(1180px,100% - 2.5rem);height:1px;transform:translateX(-50%) scaleX(var(--ls,1));background:linear-gradient(90deg,transparent,rgba(111,143,255,.55),rgba(255,95,196,.5),rgba(255,166,107,.35),transparent);opacity:.7}
.ar{display:inline-block;margin-left:.55rem;transition:transform .55s var(--ease)}
.btn:hover .ar{transform:translateX(5px)}
.gh .ar{margin-left:.4rem}.gh:hover .ar{transform:translate(3px,-3px)}
.crow i{font-style:normal;font-size:1.2rem;color:var(--mute);margin-left:.75rem;transition:transform .55s var(--ease),color .4s}
.crow:hover i{transform:translate(4px,-4px);color:var(--text)}
.crow>span{margin-left:auto}
.sk::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:radial-gradient(260px circle at 80% -10%,color-mix(in srgb,var(--tint) 35%,transparent),transparent 70%);opacity:0;transition:opacity .6s var(--ease)}
.sk:hover::before{opacity:1}

/* cursor */
.cur,.dot{position:fixed;left:0;top:0;z-index:90;pointer-events:none;opacity:0;transition:opacity .4s}
.cur.on,.dot.on{opacity:1}
.cur{width:34px;height:34px;margin:-17px 0 0 -17px;border-radius:50%;border:1px solid rgba(255,255,255,.5);transition:opacity .4s,width .45s var(--ease),height .45s var(--ease),margin .45s var(--ease),border-color .3s,background .3s}
.cur[data-s=link]{width:56px;height:56px;margin:-28px 0 0 -28px;border-color:var(--c);background:rgba(255,95,196,.1)}
.cur[data-s=card]{width:84px;height:84px;margin:-42px 0 0 -42px;border-color:var(--d);background:rgba(55,227,208,.07)}
.dot{width:5px;height:5px;margin:-2.5px 0 0 -2.5px;border-radius:50%;background:#fff}
html.has-cur,html.has-cur a,html.has-cur button,html.has-cur .shot{cursor:none}
.mag{will-change:transform}

@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms !important;animation-delay:0s !important;transition-duration:.01ms !important}html{scroll-behavior:auto}.aurora::after,.dust,.cur,.dot{display:none}}
</style>
</head>

/* Aurora + a very small amount of drifting dust */
function Backdrop() {
  const cv = useRef(null);
  useEffect(() => {
    if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    const el = cv.current, x = el.getContext('2d'), cols = ['111,143,255', '139,92,246', '255,95,196', '55,227,208', '255,166,107'];
    let w, h, raf = 0, P = [];
    const fit = () => { w = el.width = innerWidth; h = el.height = innerHeight; P = Array.from({ length: w < 700 ? 18 : 32 }, () => ({ x: Math.random() * w, y: Math.random() * h, v: .08 + Math.random() * .18, r: .7 + Math.random() * 1.2, c: cols[Math.random() * 5 | 0], a: .25 + Math.random() * .4 })); };
    const draw = () => { x.clearRect(0, 0, w, h); for (const p of P) { p.y -= p.v; if (p.y < -4) { p.y = h + 4; p.x = Math.random() * w; } x.fillStyle = 'rgba(' + p.c + ',' + p.a + ')'; x.beginPath(); x.arc(p.x, p.y, p.r, 0, 6.283); x.fill(); } raf = requestAnimationFrame(draw); };
    const vis = () => { cancelAnimationFrame(raf); if (!document.hidden) draw(); };
    fit(); draw(); addEventListener('resize', fit); document.addEventListener('visibilitychange', vis);
    return () => { cancelAnimationFrame(raf); removeEventListener('resize', fit); document.removeEventListener('visibilitychange', vis); };
  }, []);
  return html`<div className="aurora" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div><canvas className="dust" ref=${cv} aria-hidden="true"></canvas>`;
}

/* The one 3D object: a chrome torus knot lit by a colourful procedural environment */
function Core() {
  const cv = useRef(null);
  useEffect(() => {
    if (!window.THREE) return;
    const T = THREE, el = cv.current, host = el.parentElement, rm = matchMedia('(prefers-reduced-motion: reduce)').matches;
    let ren; try { ren = new T.WebGLRenderer({ canvas: el, alpha: true, antialias: true, powerPreference: 'low-power' }); } catch (e) { return; }
    ren.setPixelRatio(Math.min(devicePixelRatio || 1, 1.5)); ren.outputEncoding = T.sRGBEncoding; ren.toneMapping = T.ACESFilmicToneMapping; ren.toneMappingExposure = 1.15;
    const sc = new T.Scene(), cam = new T.PerspectiveCamera(40, 1, .1, 60); cam.position.z = 8;
    // colourful studio for reflections
    const envS = new T.Scene();
    [[0x4f6eff, [-9, 3, 4], 3], [0xff5fc4, [9, -2, 3], 3], [0x37e3d0, [0, 9, -2], 2.5], [0xffa66b, [3, -9, 4], 2], [0x8b5cf6, [0, 0, -10], 2.5], [0xffffff, [-3, 6, 9], 4]].forEach(([c, p, k]) => {
      const m = new T.Mesh(new T.PlaneGeometry(9, 9), new T.MeshBasicMaterial({ color: new T.Color(c).multiplyScalar(k), side: T.DoubleSide })); m.position.set(...p); m.lookAt(0, 0, 0); envS.add(m);
    });
    const pm = new T.PMREMGenerator(ren), env = pm.fromScene(envS, .04).texture; pm.dispose();
    const obj = new T.Mesh(new T.TorusKnotGeometry(1.05, .36, 240, 36, 2, 3), new T.MeshStandardMaterial({ color: 0xdfe6ff, metalness: 1, roughness: .16, envMap: env, envMapIntensity: 1.25 }));
    sc.add(obj);
    const m = { x: 0, y: 0 }, cur = { x: 0, y: 0 };
    const fit = () => { const w = host.clientWidth, h = host.clientHeight, wide = w > 900; ren.setSize(w, h, false); cam.aspect = w / h; cam.updateProjectionMatrix(); obj.userData.bx = wide ? 2.7 : 0; obj.userData.by = wide ? .2 : 1.9; obj.scale.setScalar(wide ? 1 : Math.min(1, w / 640)); if (rm) { obj.position.set(obj.userData.bx, obj.userData.by, 0); ren.render(sc, cam); } };
    let raf = 0, vis = true; const t0 = performance.now();
    const frame = () => {
      const t = (performance.now() - t0) / 1000;
      cur.x += (m.x - cur.x) * .05; cur.y += (m.y - cur.y) * .05;
      obj.rotation.set(t * .16 + cur.y * .7, t * .22 + cur.x * 1.1, 0);
      obj.position.set(obj.userData.bx + cur.x * .5, obj.userData.by + Math.sin(t * .8) * .12 - cur.y * .3, 0);
      ren.render(sc, cam); if (vis && !rm) raf = requestAnimationFrame(frame);
    };
    const onm = e => { m.x = e.clientX / innerWidth - .5; m.y = e.clientY / innerHeight - .5; };
    fit(); frame();
    const io = new IntersectionObserver(([e]) => { vis = e.isIntersecting; if (vis && !rm) { cancelAnimationFrame(raf); frame(); } }); io.observe(host);
    const ro = new ResizeObserver(fit); ro.observe(host); addEventListener('pointermove', onm, { passive: true });
    return () => { cancelAnimationFrame(raf); io.disconnect(); ro.disconnect(); removeEventListener('pointermove', onm); ren.dispose(); };
  }, []);
  return html`<canvas className="core" ref=${cv} aria-hidden="true"></canvas>`;
}

/* Motion: smooth scroll, reveals, parallax, tilt, magnetic buttons, cursor */
function Fx() {
  const ring = useRef(null), dot = useRef(null);
  useEffect(() => {
    if (matchMedia('(prefers-reduced-motion: reduce)').matches || !window.gsap || !window.ScrollTrigger) return;
    const g = gsap, root = document.documentElement, ac = new AbortController(), o = { signal: ac.signal };
    const fine = matchMedia('(hover:hover) and (pointer:fine)').matches;
    g.registerPlugin(ScrollTrigger);
    let lenis = null, tk = null;
    if (window.Lenis) {
      lenis = new Lenis({ lerp: .09 }); lenis.on('scroll', ScrollTrigger.update);
      tk = t => lenis.raf(t * 1000); g.ticker.add(tk); g.ticker.lagSmoothing(0);
      document.addEventListener('click', e => {
        const a = e.target.closest('a[href^="#"]'), h = a && a.getAttribute('href'), el = h && h.length > 1 && document.querySelector(h);
        if (!el) return; e.preventDefault(); lenis.scrollTo(el, { offset: -64, duration: 1.5 }); history.replaceState(null, '', h);
      }, o);
    }
    const ctx = g.context(() => {
      const sc = (t, s, e) => ({ trigger: t, start: s, end: e, scrub: true });
      g.to('.name', { yPercent: -8, opacity: .3, ease: 'none', scrollTrigger: sc('#home', 'top top', 'bottom top') });
      g.to('.core', { yPercent: 12, ease: 'none', scrollTrigger: sc('#home', 'top top', 'bottom top') });
      g.fromTo('.aurora', { '--py': '0px' }, { '--py': '-160px', ease: 'none', scrollTrigger: { trigger: 'main', start: 'top top', end: 'bottom bottom', scrub: 1 } });
      g.utils.toArray('section:not(.hero)').forEach(s => g.fromTo(s, { '--ls': 0 }, { '--ls': 1, ease: 'power2.out', scrollTrigger: sc(s, 'top 92%', 'top 60%') }));
      g.utils.toArray('[data-r]').forEach(el => {
        const h = el.querySelector('h2');
        if (h) {
          const sb = el.querySelector('.sub'), tl = g.timeline({ scrollTrigger: { trigger: el, start: 'top 88%', once: true } });
          tl.from(h, { y: 46, opacity: 0, filter: 'blur(10px)', letterSpacing: '.05em', duration: 1.2, ease: 'expo.out' });
          if (sb) tl.from(sb, { y: 24, opacity: 0, duration: .9, ease: 'expo.out' }, .18);
        } else g.from(el, { y: 36, opacity: 0, duration: 1.1, ease: 'expo.out', scrollTrigger: { trigger: el, start: 'top 88%', once: true } });
      });
      g.from('.bw', { y: 40, opacity: 0, scale: .96, duration: 1, ease: 'expo.out', stagger: .08, scrollTrigger: { trigger: '.bento', start: 'top 85%', once: true } });
      g.utils.toArray('.shot').forEach(s => {
        g.fromTo(s, { clipPath: 'inset(12% 8% 12% 8% round 24px)' }, { clipPath: 'inset(0% 0% 0% 0% round 24px)', duration: 1.4, ease: 'expo.out', scrollTrigger: { trigger: s, start: 'top 85%', once: true } });
        const w = s.querySelector('.win'); w && g.fromTo(w, { yPercent: 10 }, { yPercent: -4, ease: 'none', scrollTrigger: sc(s, 'top bottom', 'bottom top') });
      });
    });
    if (fine) {
      root.classList.add('has-cur');
      const r = ring.current, d = dot.current, rq = [g.quickTo(r, 'x', { duration: .5, ease: 'power3' }), g.quickTo(r, 'y', { duration: .5, ease: 'power3' })], dq = [g.quickTo(d, 'x', { duration: .1 }), g.quickTo(d, 'y', { duration: .1 })];
      let first = true;
      addEventListener('pointermove', e => {
        if (first) { first = false; g.set([r, d], { x: e.clientX, y: e.clientY }); r.classList.add('on'); d.classList.add('on'); }
        rq[0](e.clientX); rq[1](e.clientY); dq[0](e.clientX); dq[1](e.clientY);
      }, { passive: true, signal: ac.signal });
      document.addEventListener('pointerover', e => { const t = e.target.closest('.shot,.sk,a,button'); r.dataset.s = !t ? '' : t.matches('.shot') ? 'card' : 'link'; }, o);
      document.querySelectorAll('.btn,.logo').forEach(el => {
        el.classList.add('mag');
        el.addEventListener('pointermove', e => { const b = el.getBoundingClientRect(); g.to(el, { x: (e.clientX - b.left - b.width / 2) * .3, y: (e.clientY - b.top - b.height / 2) * .3, duration: .5, ease: 'power3.out' }); }, o);
        el.addEventListener('pointerleave', () => g.to(el, { x: 0, y: 0, duration: .9, ease: 'power3.out' }), o);
      });
      document.querySelectorAll('.shot').forEach(el => {
        el.addEventListener('pointermove', e => { const b = el.getBoundingClientRect(), px = (e.clientX - b.left) / b.width, py = (e.clientY - b.top) / b.height; g.to(el, { rotationY: (px - .5) * 10, rotationX: -(py - .5) * 10, y: -8, transformPerspective: 1000, duration: .7, ease: 'power3.out', overwrite: 'auto' }); }, o);
        el.addEventListener('pointerleave', () => g.to(el, { rotationX: 0, rotationY: 0, y: 0, duration: .9, ease: 'power3.out', overwrite: 'auto' }), o);
      });
    }
    const rf = () => ScrollTrigger.refresh(); addEventListener('load', rf, o); const rt = setTimeout(rf, 1500);
    return () => { clearTimeout(rt); ac.abort(); ctx.revert(); if (lenis) { g.ticker.remove(tk); lenis.destroy(); } root.classList.remove('has-cur'); };
  }, []);
  return html`<div className="cur" ref=${ring}></div><div className="dot" ref=${dot}></div>`;
}

function App() {
  const [active, setActive] = useState("home");
  useEffect(() => {
    const io = new IntersectionObserver(es => es.forEach(e => e.isIntersecting && setActive(e.target.id)), { rootMargin: "-45% 0px -50% 0px" });
    DATA.nav.forEach(([, id]) => { const el = document.getElementById(id); el && io.observe(el); });
    return () => io.disconnect();
  }, []);
  return html`<${Backdrop} /><${Fx} /><${Nav} active=${active} />
    <main><${Hero} /><${About} /><${Skills} /><${Projects} /><${Achievements} /><${Contact} /></main>
    <footer><div className="wrap"><span>© ${new Date().getFullYear()} ${DATA.name}</span><span>Designed and built by me.</span></div></footer>`;
}
